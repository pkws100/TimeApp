# Include within the native TimeApp VirtualHost after its existing Directory blocks.
# Apache prefork with mod_php, mod_rewrite and mod_setenvif is required.
# Replace timeapp.example.invalid and 192.0.2.10 with the verified public host and proxy peer.
RewriteEngine On

# CONN_REMOTE_ADDR is the connection peer, independent of mod_remoteip.
RewriteCond %{HTTP_HOST} =timeapp.example.invalid [NC]
RewriteCond %{CONN_REMOTE_ADDR} !=192.0.2.10
RewriteRule ^ - [F,END]

RewriteCond %{HTTP_HOST} =timeapp.example.invalid [NC]
RewriteCond %{CONN_REMOTE_ADDR} =192.0.2.10
RewriteCond %{HTTP:X-Forwarded-Proto} =http
RewriteRule ^ https://timeapp.example.invalid%{REQUEST_URI} [R=308,END,NE]

RewriteCond %{HTTP_HOST} =timeapp.example.invalid [NC]
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
RewriteRule ^ - [F,END]

SetEnvIfExpr "%{CONN_REMOTE_ADDR} == '192.0.2.10' && req('Host') == 'timeapp.example.invalid' && req('X-Forwarded-Proto') == 'https'" HTTPS=on

# Normalize both response tables after the PHP request reaches the front controller.
<If "%{THE_REQUEST} =~ m#^[^ ]+ +/admin/personnel-documents(?:[/? ]|$)#">
    Header onsuccess unset X-Frame-Options
    Header always set X-Frame-Options "DENY"
    Header onsuccess unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin"
    Header onsuccess unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
</If>

# PHP reads upload_tmp_dir before the front controller can select a route.
php_admin_value upload_tmp_dir "/run/timeapp-personnel/incoming"

<Directory "/var/www/html/public">
    Options -Indexes -FollowSymLinks -SymLinksIfOwnerMatch
</Directory>

<DirectoryMatch "^/(?:etc/timeapp-personnel|var/lib/timeapp-personnel(?:-backup)?|run/timeapp-personnel|run/clamav|var/lib/clamav)(?:/|$)">
    Options -Indexes -FollowSymLinks -SymLinksIfOwnerMatch
    AllowOverride None
    Require all denied
</DirectoryMatch>
